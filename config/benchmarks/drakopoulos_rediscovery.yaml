# Drakopoulos Graphite Electrode Manufacturing Rediscovery Benchmark Configuration
benchmark_name: "drakopoulos_graphite_offline_rediscovery"
version: "1.0.0"

dataset:
  dataset_id: "drakopoulos_graphite"
  display_name: "Graphite Process-15"
  source_doi: "10.17632/4dh2h3tsf4.1"
  evidence_kind: "PHYSICAL_HISTORICAL"
  normalized_runs_path: "data/external/drakopoulos_graphite/1/processed/1/normalized_runs.json"

target:
  name: "cell_capacity_mah"
  units: "mAh"

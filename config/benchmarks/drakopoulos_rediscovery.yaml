# Drakopoulos Graphite Electrode Manufacturing Rediscovery Benchmark Configuration (v4)
benchmark_name: "drakopoulos_graphite_offline_rediscovery_v4"
version: "4.0.0"

dataset:
  dataset_id: "drakopoulos_graphite"
  display_name: "Graphite Process-15"
  source_doi: "10.17632/4dh2h3tsf4.1"
  evidence_kind: "PHYSICAL_HISTORICAL"
  normalized_runs_path: "data/external/drakopoulos_graphite/1/processed/2/normalized_runs.json"
  partition: "PROSPECTIVE_MODEL_VALIDATION"

target:
  name: "discharge_specific_capacity_cycle30_mah_g"
  units: "mAh/g"
  sense: "maximize"
  source_column: "Discharge Specific Capacity Cycle 30 (D30_mAh / Active_Mass_mg * 1000)"

optimization:
  candidate_id_column: "recipe_id"
  candidate_pool_size: 12
  initial_design_size: 3
  budget_primary: 5
  max_steps: 10
  ucb_beta: 2.0
  seeds:
    - 11
    - 23
    - 42
    - 67
    - 101
    - 137
    - 179
    - 223
    - 281
    - 353
  policies:
    - "AICOSCIENTIST_PROCESS_SURROGATE"
    - "DIRECT_BOTORCH_BASELINE"
    - "random"
    - "aicointel_greedy"
    - "aicointel_ucb"

mode_1_specification:
  mode: "SOURCE_OBSERVED_BEST_REDISCOVERY"
  status: "ACTIVE"
  ground_truth_best_recipe_id: "protocol-c1c280b7366f"
  ground_truth_best_source_case: "Case 56 (Uncalendered)"
  ground_truth_best_cells:
    - "ASC-52"
    - "ASC-53"
    - "ASC-54"
  ground_truth_best_capacity_mah_g: 402.25
  ground_truth_best_std_mah_g: 1.76
  runner_up_recipe_id: "protocol-fd150c39c22f"
  runner_up_capacity_mah_g: 392.51
  third_place_recipe_id: "protocol-0d38055e23a7"
  third_place_capacity_mah_g: 354.54

mode_2_specification:
  mode: "PUBLISHED_VALIDATED_DESIGN_REDISCOVERY"
  status: "PUBLISHED_DESIGN_REQUIRES_RESTRICTED_PARTITION_C_MAPPING"
  published_high_loading_rediscovery_status: "NOT_EVALUABLE_WITH_AVAILABLE_D30"
  rationale: "Mendeley source release DOI 10.17632/4dh2h3tsf4.1 provides alchemite_model_training.txt which configures proprietary Intellegens Alchemite API upload and training without optimization proposals or output recipes. In Drakopoulos et al. (2021) Tables S5-S6, Alchemite design represents an aggregate comparative set rather than an isolated recoverable single-cell ID distinct from the Nextrode series. Offline rediscovery fails closed with qualifier PUBLISHED_DESIGN_REQUIRES_RESTRICTED_PARTITION_C_MAPPING."

task_2_specification:
  task_name: "HIGHER_LOADING_MEASURED_D30_PROXY"
  display_name: "Higher-Loading Measured-D30 Proxy Subset"
  proxy_filter: "coating_gap_um >= 150.0 (observed mass ~11-17 mg)"
  candidate_pool_size: 9
  ground_truth_best_recipe_id: "protocol-0d38055e23a7"
  ground_truth_best_capacity_mah_g: 354.54
  published_high_loading_rediscovery_status: "NOT_EVALUABLE_WITH_AVAILABLE_D30"
  rationale: "Exact published >=25 mg high-loading target is not evaluable with available data because all 300 um cells in ASC lack usable cycle 30 measurements. Benchmark evaluates the highest-loading subset with valid D30 data as a measured proxy."




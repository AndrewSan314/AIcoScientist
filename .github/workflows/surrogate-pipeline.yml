name: Surrogate pipeline smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-test.txt
      - run: python -m pytest -q tests/process/test_surrogate_pipeline.py -p no:cacheprovider
      - run: python scripts/run_maspo_pipeline.py --config config/maspo/synthetic.yaml --output outputs/maspo_pipeline_synthetic_ci
